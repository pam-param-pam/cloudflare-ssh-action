name: Cloudflare SSH
description: Run a command over SSH through Cloudflare Access and Cloudflare Tunnel.

inputs:
  host:
    description: Cloudflare Access hostname, for example ssh.example.com
    required: true
  username:
    description: Remote SSH username
    required: true
  private-key:
    description: SSH private key used to authenticate to the SSH server
    required: true
  known-hosts:
    description: Trusted known_hosts entry for the SSH server
    required: true
  service-token-id:
    description: Cloudflare Access service-token client ID
    required: true
  service-token-secret:
    description: Cloudflare Access service-token client secret
    required: true
  command:
    description: Command to execute on the remote host
    required: true
  cloudflared-version:
    description: Pinned cloudflared version
    required: false
    default: "2026.5.1"
  connect-timeout:
    description: SSH connection timeout in seconds
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USERNAME: ${{ inputs.username }}
        CLOUDFLARED_VERSION: ${{ inputs.cloudflared-version }}
        CONNECT_TIMEOUT: ${{ inputs.connect-timeout }}
      run: |
        set -euo pipefail

        [[ "$RUNNER_OS" == "Linux" ]] || {
          echo "Cloudflare SSH supports Linux runners only." >&2
          exit 1
        }

        [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
          echo "Invalid SSH hostname." >&2
          exit 1
        }

        [[ "$SSH_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]] || {
          echo "Invalid SSH username." >&2
          exit 1
        }

        [[ "$CLOUDFLARED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Invalid cloudflared version." >&2
          exit 1
        }

        [[ "$CONNECT_TIMEOUT" =~ ^[0-9]+$ ]] &&
          (( CONNECT_TIMEOUT >= 1 && CONNECT_TIMEOUT <= 300 )) || {
          echo "connect-timeout must be between 1 and 300 seconds." >&2
          exit 1
        }

    - name: Install cloudflared
      shell: bash
      env:
        CLOUDFLARED_VERSION: ${{ inputs.cloudflared-version }}
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) asset="cloudflared-linux-amd64" ;;
          aarch64|arm64) asset="cloudflared-linux-arm64" ;;
          *)
            echo "Unsupported runner architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        url="https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}"
        curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/cloudflared"
        chmod 700 "$RUNNER_TEMP/cloudflared"
        "$RUNNER_TEMP/cloudflared" --version

    - name: Configure SSH
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USERNAME: ${{ inputs.username }}
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        CONNECT_TIMEOUT: ${{ inputs.connect-timeout }}
      run: |
        set -euo pipefail

        ssh_dir="$RUNNER_TEMP/cloudflare-ssh"
        install -m 700 -d "$ssh_dir"

        printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_deploy"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
        chmod 600 "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"

        cat > "$ssh_dir/proxy.sh" <<'EOF_PROXY'
        #!/usr/bin/env bash
        set -euo pipefail

        exec "$RUNNER_TEMP/cloudflared" access ssh \
          --hostname "$1" \
          --id "$CF_ACCESS_CLIENT_ID" \
          --secret "$CF_ACCESS_CLIENT_SECRET"
        EOF_PROXY

        chmod 700 "$ssh_dir/proxy.sh"

        cat > "$ssh_dir/config" <<EOF_CONFIG
        Host cloudflare-remote
          HostName ${SSH_HOST}
          User ${SSH_USERNAME}
          IdentityFile ${ssh_dir}/id_deploy
          IdentitiesOnly yes
          BatchMode yes
          ConnectTimeout ${CONNECT_TIMEOUT}
          StrictHostKeyChecking yes
          UserKnownHostsFile ${ssh_dir}/known_hosts
          ProxyCommand ${ssh_dir}/proxy.sh %h
        EOF_CONFIG

        chmod 600 "$ssh_dir/config"

    - name: Run remote command
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.service-token-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.service-token-secret }}
        REMOTE_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        ssh -F "$RUNNER_TEMP/cloudflare-ssh/config" cloudflare-remote "$REMOTE_COMMAND"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/cloudflare-ssh"
        rm -f "$RUNNER_TEMP/cloudflared"