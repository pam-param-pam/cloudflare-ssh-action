name: Cloudflare SSH
description: Run commands over SSH through Cloudflare Access using a service token

inputs:
  host:
    description: SSH hostname exposed through Cloudflare
    required: true
  username:
    description: Remote SSH username
    required: true
  private-key:
    description: OpenSSH private key without a passphrase
    required: true
  known-hosts:
    description: SSH known_hosts content
    required: false
    default: ""
  service-token-id:
    description: Raw Cloudflare Access service-token client ID
    required: true
  service-token-secret:
    description: Raw Cloudflare Access service-token client secret
    required: true
  command:
    description: Command to execute remotely
    required: true
  cloudflared-version:
    description: cloudflared version
    required: false
    default: "2026.5.1"
  connect-timeout:
    description: SSH connection timeout in seconds
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Install cloudflared
      shell: bash
      env:
        CLOUDFLARED_VERSION: ${{ inputs.cloudflared-version }}
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/cloudflared-bin"
        mkdir -p "$install_dir"
        curl -L --fail --retry 3 -o "$install_dir/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
        chmod 700 "$install_dir/cloudflared"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/cloudflared" --version

    - name: Configure SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cloudflare-deploy-key
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/cloudflare-deploy-key

        if [[ -n "$SSH_KNOWN_HOSTS" ]]; then
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        fi

    - name: Run remote command
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.service-token-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.service-token-secret }}
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.username }}
        SSH_COMMAND: ${{ inputs.command }}
        SSH_CONNECT_TIMEOUT: ${{ inputs.connect-timeout }}
        HAS_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail

        ssh_options=(
          -o 'ProxyCommand=cloudflared access ssh --hostname %h --id "$CF_ACCESS_CLIENT_ID" --secret "$CF_ACCESS_CLIENT_SECRET"'
          -o "ConnectTimeout=${SSH_CONNECT_TIMEOUT}"
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -i ~/.ssh/cloudflare-deploy-key
        )

        if [[ -n "$HAS_KNOWN_HOSTS" ]]; then
          ssh_options+=(-o StrictHostKeyChecking=yes)
        else
          ssh_options+=(-o StrictHostKeyChecking=accept-new)
        fi

        ssh "${ssh_options[@]}" "${SSH_USER}@${SSH_HOST}" "$SSH_COMMAND"