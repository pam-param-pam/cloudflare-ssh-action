name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run this workflow from main." >&2; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must match vX.Y.Z." >&2; exit 1; }
          ! git rev-parse "$VERSION" >/dev/null 2>&1 || { echo "Tag $VERSION already exists." >&2; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes --title "$VERSION"

      - name: Update major tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
